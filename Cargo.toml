[package]
name = "openclipmultiband"
description = "OpenClip Multiband: 1-to-6-band Linkwitz-Riley multiband clipper (a clipper per band + master clipper) on OpenPluginSDK with GoodLookin DRI"
version = "1.0.0-beta"
authors = ["Marcos Quirino Deida"]
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
olm-api = { path = "crates/api" }
clip = { path = "crates/clip" }
# OpenPluginSDK main (19fac89) in ../../Dependencies (pinned in scripts/build.sh).
openplugin = { path = "../../Dependencies/OpenPluginSDK/crates/openplugin" }
# Text measuring for the kit: the GoodLookin DRI in the SDK's tree, the same crate the SDK uses.
goodlookindri-shell = { path = "../../Dependencies/OpenPluginSDK/crates/goodlookindri/shell" }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", default-features = false }

[workspace]
members = ["crates/*"]

[profile.release]
opt-level = 3
lto = "thin"

[dev-dependencies]
openplugin = { path = "../../Dependencies/OpenPluginSDK/crates/openplugin", features = ["testing"] }
